name: publica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixa os arquivos do site
        run: |
          set -euo pipefail
          mkdir -p site
          D="https://drive.google.com/uc?export=download&id="
          curl -sSL --fail --retry 3 -o lista.txt "${D}12CUhXoV7-pEN_FNccf2LnwuTGKeBsFXU"
          while read -r nome id; do
            [ -z "$nome" ] && continue
            curl -sSL --fail --retry 3 -o "site/$nome" "${D}${id}"
            test -s "site/$nome"
          done < lista.txt
          grep -q "clipbox" site/index.html
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
