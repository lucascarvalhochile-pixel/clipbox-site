name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixa os arquivos do site
        run: |
          set -euo pipefail
          mkdir -p site
          get() { curl -sSL --fail --retry 3 -o "site/$1" "https://drive.google.com/uc?export=download&id=$2"; test -s "site/$1"; }
          get index.html 1Os2jyK2K3vDy0uMOxdCBD8VaGtxi3dbx
          get corte.mp4 1kvlYHParFU83S_2_qmNGObXTMNpv-P92
          get mapa1.mp4 1mUh95QE_euAuQ-xS-vMF3QoGdNg3C1HL
          get mapa2.mp4 18ed98mpMh3ab-BC_oDea2vL9Akhv_WA8
          get corte.jpg 13M3kSCVqlJkw57gpJLzBwN-aVrCX00eg
          get mapa1.jpg 1rwlnzzJFydYnRp5ui_N9IzVU6qxuedT3
          get mapa2.jpg 1mUnDKyNsoWKsZajqFhrtxnhLhd43Ek5v
          grep -q "clipbox" site/index.html
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
